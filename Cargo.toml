[workspace]
resolver = "2"
members = [
    "crates/wire",
    "crates/storage",
    "crates/server",
    "crates/smart_client",
    "crates/logger"
]
default-members = ["crates/server"]

[workspace.package]
edition = "2024"
version = "1.0.0"

[workspace.lints.rust] # For exploratory dev only.
# unused = { level = "allow", priority = -1 }
# dead_code = { level = "allow", priority = -1 }

[workspace.dependencies]
wire    = { path = "crates/wire" }
storage = { path = "crates/storage" }
logger  = { path = "crates/logger" }
log     = "0.4"
simplelog = "0.12"
anyhow  = "1.0"
tokio   = { version = "1", features = ["full"] }
libc    = "0.2"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
debug = "line-tables-only"
